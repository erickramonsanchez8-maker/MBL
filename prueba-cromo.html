<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba cromada — MBL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--chrome:#e8edf2;--bg:#090b0f}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#343a43 0,#171b22 38%,#090b0f 78%);font-family:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif}
.stage{width:100%;min-height:100vh;display:grid;place-items:center;padding:5vw;position:relative}
.stage:before{content:"";position:absolute;width:min(78vw,900px);height:min(40vw,360px);border-radius:50%;background:radial-gradient(ellipse,rgba(208,220,235,.13),transparent 68%);filter:blur(22px)}
svg{width:min(96vw,1200px);height:auto;overflow:visible;position:relative}
text{font-family:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif;font-weight:700;letter-spacing:-.045em}
.chrome-word{fill:url(#metal);stroke:#f9fcff;stroke-opacity:.52;stroke-width:1.3;paint-order:stroke fill;filter:url(#inflated)}
.chrome-shadow{fill:#07090d;opacity:.9;transform:translate(0px,13px);filter:blur(10px)}
.chrome-depth{fill:#555d68;stroke:#303741;stroke-width:3;paint-order:stroke fill;transform:translate(0px,5px)}
.chrome-highlight{fill:url(#shine);opacity:.95;filter:blur(1px)}
@media(prefers-reduced-motion:no-preference){.chrome-word{transform-origin:center;animation:float 6s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0) rotate(-.35deg)}50%{transform:translateY(-5px) rotate(.35deg)}}}
@media(max-width:600px){svg{width:110vw}}
</style>
</head>
<body>
<main class="stage" aria-label="Prueba de tipografía cromada">
<svg viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">PERMANECER</title><desc id="desc">Texto de prueba con acabado de globo cromado plateado sobre fondo oscuro.</desc>
<defs>
 <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ffffff"/>
  <stop offset=".10" stop-color="#aeb8c4"/>
  <stop offset=".20" stop-color="#f9fcff"/>
  <stop offset=".31" stop-color="#697582"/>
  <stop offset=".43" stop-color="#f5f8fb"/>
  <stop offset=".56" stop-color="#7e8996"/>
  <stop offset=".68" stop-color="#ffffff"/>
  <stop offset=".82" stop-color="#9da8b5"/>
  <stop offset="1" stop-color="#eef2f6"/>
 </linearGradient>
 <linearGradient id="shine" x1="0" y1="0" x2=".15" y2="1">
  <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
  <stop offset=".22" stop-color="#fff" stop-opacity=".48"/>
  <stop offset=".42" stop-color="#fff" stop-opacity="0"/>
  <stop offset="1" stop-color="#fff" stop-opacity="0"/>
 </linearGradient>
 <filter id="inflated" x="-20%" y="-35%" width="140%" height="180%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="2.8" result="blur"/>
  <feSpecularLighting in="blur" surfaceScale="8" specularConstant="1.15" specularExponent="24" lighting-color="#fff" result="spec">
   <fePointLight x="-350" y="-420" z="260"/>
  </feSpecularLighting>
  <feComposite in="spec" in2="SourceAlpha" operator="in" result="specCut"/>
  <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="specCut"/></feMerge>
 </filter>
 <clipPath id="wordClip"><text x="600" y="225" text-anchor="middle" font-size="145">PERMANECER</text></clipPath>
</defs>
<text class="chrome-shadow" x="600" y="225" text-anchor="middle" font-size="145">PERMANECER</text>
<text class="chrome-depth" x="600" y="225" text-anchor="middle" font-size="145">PERMANECER</text>
<text class="chrome-word" x="600" y="225" text-anchor="middle" font-size="145">PERMANECER</text>
<g clip-path="url(#wordClip)">
 <ellipse class="chrome-highlight" cx="470" cy="112" rx="400" ry="52"/>
 <path d="M170 160 Q600 60 1030 155" fill="none" stroke="#fff" stroke-opacity=".62" stroke-width="7" stroke-linecap="round" filter="url(#inflated)"/>
</g>
</svg>
</main>
</body>
</html>
